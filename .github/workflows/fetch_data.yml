name: 每日拉取股票数据

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取美股数据
        run: python scripts/fetch_us.py

      - name: 拉取A股数据
        run: python scripts/fetch_cn.py
        continue-on-error: true   # A股源对境外IP可能403，失败不阻断美股数据提交

      - name: 提交数据到仓库
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/
          git diff --staged --quiet && echo "无数据变化，跳过" && exit 0
          git commit -m "数据更新 $(date +'%Y-%m-%d')"
          # push 前先同步远端，避免与其它提交撞车导致 rejected；失败则重试几次
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "第 $i 次 push 失败，重试..." && sleep 5
          done
          echo "push 多次失败" && exit 1
